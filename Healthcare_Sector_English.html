/* Dark, high-contrast reading theme. All styles remain inside this standalone file. */
:root {
  color-scheme: dark;
  --ink: #edf7fc;
  --muted: #c1d4de;
  --teal: #71dcd3;
  --teal-dark: #baf9f0;
  --sea: #244954;
  --pale: #142d3b;
  --coral: #ffbb91;
  --paper: #162938;
  --line: #3c5968;
  --red: #ff9aa1;
  --green: #8ee4bd;
  --shadow: 0 18px 48px rgba(1, 9, 18, .42);
}
body {
  color: var(--ink);
  background: linear-gradient(125deg, #091521 0%, #112a38 48%, #101f30 100%);
  font-size: 18px;
  line-height: 1.68;
}
button:focus-visible, input:focus-visible { outline-color: #ffcc88; }
.topbar { background: rgba(13, 30, 43, .96); border-color: var(--line); }
.brand-name { font-size: clamp(20px, 2.25vw, 28px); }
.brand-small { color: var(--teal); font-size: 12px; }
.brand-mark { background: #177b83; color: #fff; }
.small-btn, .secondary {
  background: #233c4b;
  color: #f0fbff;
  border-color: #53717e;
  font-size: 16px;
}
.small-btn:hover, .secondary:hover { background: #315b67; }
.primary { background: #177b83; border-color: #42c0b9; color: #fff; font-size: 17px; }
.primary:hover { background: #12646e; }
.lesson-layout { grid-template-columns: 285px minmax(0, 1fr); max-width: 1650px; }
.sidebar { background: #142737; border-color: var(--line); box-shadow: 0 10px 32px #030b1780; }
.sidebar-label { font-size: 13px; color: var(--muted); }
.nav-item { color: #d5e6ed; font-size: 15px; padding: 11px 12px; }
.nav-item:hover { background: #244351; }
.nav-item.active { background: #24515a; color: #f0fffd; }
.nav-num { background: #294351; color: #deecf2; font-size: 12px; min-width: 28px; height: 28px; }
.nav-item.active .nav-num { background: #137e84; color: #fff; }
.screen { background: var(--paper); border-color: var(--line); }
.eyebrow { font-size: 14px; color: var(--teal); }
h1 { font-size: clamp(39px, 4.7vw, 66px); line-height: 1.13; }
h2 { font-size: clamp(24px, 2.4vw, 31px); }
h3 { font-size: 19px; }
.lead { font-size: clamp(20px, 1.9vw, 25px); color: #d0e3eb; }
.hero { background: linear-gradient(125deg, #203f4e, #193745); border: 1px solid #426675; }
.hero h2 { font-size: 27px; }
.hero p { font-size: 20px; color: #d4e7ec; }
.hero-art { filter: drop-shadow(0 8px 2px #050d185c); }
.hero-cover {
  background: radial-gradient(circle at 92% 16%, #245a62 0 14%, transparent 14.3%),
              radial-gradient(circle at 87% 77%, #624537 0 11%, transparent 11.3%),
              linear-gradient(132deg, #193b48, #162938 57%, #222e3e);
}
.hero-cover h1 { font-size: clamp(48px, 6.2vw, 82px); }
.cover-mini { background: #213c49; border-color: var(--line); }
.cover-mini strong { font-size: 31px; color: var(--teal); }
.cover-mini span { font-size: 15px; color: var(--muted); }
.info-card, .info-card.services, .info-card.team { background: #1e3543; border-color: #3e5b69; }
.info-card.services { background: #273642; }
.info-card.team { background: #1b3b43; }
.info-card .kicker { font-size: 14px; color: var(--teal); }
.simple-list li { font-size: 18px; }
.team-member { background: #243f4d; border-color: #496775; font-size: 17px; }
.team-member strong { color: #f1fcff; }
.team-member span { color: #c5d9e2; font-size: 15px; }
.role-icon { color: var(--teal); }
.vocab-heading p, .note { font-size: 16px; color: var(--muted); }
.table-wrap { border-color: var(--line); }
table { font-size: 17px; }
th { background: #284955; color: #e1fff9; font-size: 16px; padding: 15px 16px; }
td { border-color: #385361; padding: 13px 16px; }
tr:nth-child(even) td { background: #1d3644; }
td:first-child { color: #f0f9fd; }
td:last-child { color: #9ff4dd; }
.remember { background: #47362e; color: #ffe4c9; font-size: 17px; }
.tag { background: #22505a; color: #dffff9; font-size: 14px; }
.progress-track { background: #385563; }
.slide-count { color: #d4e5ed; font-size: 15px; }
.footer { background: #0c202d; color: #dbecef; font-size: 15px; }
.mode-btn { background: #233d4b; color: #e3f2f8; border-color: #58727e; font-size: 16px; }
.mode-btn.active { background: #1b7f82; border-color: #6ad9d0; color: #fff; }
.question { background: #1e3544; border-color: #44616e; }
.question-number { color: var(--teal); font-size: 13px; }
.question-title { font-size: 19px; }
.answer-btn { background: #294452; border-color: #607b87; color: #f1f9fc; font-size: 17px; }
.answer-btn:hover:not(:disabled) { background: #325c61; border-color: #85dfd3; }
.answer-btn.selected { background: #25575b; border-color: #7bddd2; color: #effffb; }
.answer-btn.correct { background: #1d5148; border-color: #79d9ab; color: #d8ffe9; }
.answer-btn.incorrect { background: #583039; border-color: #fc9298; color: #ffe1e2; }
.feedback { background: #483b30; color: #ffebd5; font-size: 16px; }
.feedback.good { background: #20493f; color: #d8ffea; }
.score-banner { background: #1d5048; border-color: #5bac92; color: #e5fff3; font-size: 18px; }
.match-col h3 { color: #d7eaf0; }
.match-option { background: #263f4d; border-color: #57717e; color: #f0f9fc; font-size: 17px; }
.match-option.selected { background: #24575a; border-color: #83e6d6; }
.match-option.matched { background: #215043; border-color: #76cba7; color: #e0ffec; }
.match-option.wrong { background: #57313c; border-color: #f18b99; }
.match-option.matched:disabled { opacity: 1; }
.match-tip { background: #254450; color: #e2f1f6; font-size: 16px; }
.gap-field { background: #263d4b; border-color: #7b9aa5; color: #fff; font-size: 18px; }
.gap-field.correct { background: #205040; border-color: #84d6ac; }
.gap-field.incorrect { background: #57333a; border-color: #f59ba4; }
.hint { color: #ffcb9b; font-size: 15px; }
.mini-subtitle, .small-print { color: #c2d7e0; font-size: 16px; }
.badge-inline { background: #543d2d; color: #ffd6a9; font-size: 13px; }
.completion { background: linear-gradient(120deg, #1e5147, #4b3b31); }
.unit-pill { background: #294755; border-color: #50737e; color: #edfbff; font-size: 15px; }
@media (max-width: 980px) {
  .lesson-layout { grid-template-columns: 1fr; }
}
@media (max-width: 620px) {
  body { font-size: 17px; }
  .brand-name { font-size: 18px; white-space: normal; max-width: 170px; line-height: 1.12; }
  .brand-small { font-size: 10px; }
  .small-btn { font-size: 14px; }
  #printBtn { display: none; }
  .hero-cover h1 { font-size: clamp(44px, 10vw, 60px); }
  .answer-btn { font-size: 16px; padding: 10px 12px; }
  td, th { font-size: 15px; padding: 11px 12px; }
}
@media print {
  :root { color-scheme: light; --ink: #173544; --muted: #526b75; --line: #d0dbde; --paper: #fff; }
  body { background: #fff; color: #173544; }
  .screen, .hero-cover, .hero, .info-card, .info-card.services, .info-card.team,
  .team-member, .cover-mini, .question, .completion, .remember, .match-tip { background: #fff; color: #173544; }
  h1, h2, h3, p, .lead, .hero p, .team-member strong, .team-member span,
  .simple-list, .vocab-heading p, .small-print, .mini-subtitle, .question-title,
  .match-col h3, td:first-child, td:last-child { color: #173544; }
  th { background: #e3f1ef; color: #173544; }
  tr:nth-child(even) td { background: #f5f9f8; }
  .footer { background: #fff; color: #333; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">+</div><div><div class="brand-small">English for healthcare students</div><div class="brand-name">Healthcare Sector English</div></div></div>
    <div class="top-actions"><button class="small-btn mobile-jump" id="jumpBtn" type="button">☰ Sections</button><button class="small-btn" id="homeBtn" type="button">⌂ Home</button><button class="small-btn" id="printBtn" type="button">⎙ Print slide</button></div>
  </header>
  <div class="lesson-layout">
    <aside class="sidebar" id="sidebar" aria-label="Lesson sections"></aside>
    <main class="main-col">
      <div class="screen" id="screen" aria-live="polite"></div>
      <nav class="slide-controls" aria-label="Slide navigation">
        <div class="slide-progress"><div class="slide-count" id="slideCount"></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
        <div class="control-buttons"><button class="secondary" id="prevBtn" type="button">← Previous</button><button class="primary" id="nextBtn" type="button">Next →</button></div>
      </nav>

const slides=[{type:"cover",name:"Welcome"},...departments.map((d,i)=>({type:"department",name:d.name,i})),{type:"comprehension",name:"Comprehension quiz"},{type:"vocabulary",name:"Vocabulary quiz"},{type:"matching",name:"Matching activity"},{type:"gaps",name:"Gap completion"}];
let index=0,compMode="reading",compAnswers={reading:{},knowledge:{}},compChecked={reading:false,knowledge:false},vocabAnswers={},vocabChecked=false,matchRound=0,matchLeft=null,matched=new Set(),matchErrors=0,matchFeedback="",gapAnswers={},gapChecked=false,gapHints=false;
function navRender(){const items=(start,end)=>slides.slice(start,end).map((s,k)=>{const n=start+k;return `<button type="button" class="nav-item ${index===n?'active':''}" data-go="${n}"><span class="nav-num">${n===0?'✦':String(n).padStart(2,'0')}</span><span>${h(s.name)}</span></button>`}).join('');$('sidebar').innerHTML=`<div class="sidebar-label">Start</div>${items(0,1)}<div class="sidebar-label">Hospital departments</div>${items(1,15)}<div class="sidebar-label">Your activities</div>${items(15,19)}`;document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.go)))}
function showCover(){return `<article class="slide hero-cover"><div class="eyebrow"><span class="dot"></span>CLASSROOM LESSON · HOSPITAL DEPARTMENTS</div><h1>Who does what<br>in a hospital?</h1><p class="lead">Learn the departments, the services they provide, the doctors and nurses who work there, and the healthcare words you need in English.</p><div class="cover-cards"><div class="cover-mini"><strong>14</strong><span>department slides</span></div><div class="cover-mini"><strong>EN → EL</strong><span>synonyms + Greek</span></div><div class="cover-mini"><strong>4</strong><span>interactive activities</span></div></div><div><button type="button" class="primary" data-next>Start the lesson →</button></div><div class="quiet-divider"></div><p class="small-print">The first eight slides are adapted from your reading (with Neurology and Psychiatry shown separately). Six further departments come from the exercise questions and use introductory teaching examples. Department staffing varies by hospital and country.</p></article>`}
function showDepartment(d,i){return `<article class="slide slide-inner"><div class="eyebrow"><span class="dot"></span>DEPARTMENT ${String(i+1).padStart(2,'0')} OF 14 ${d.extra?'<span class="badge-inline">ADDITIONAL TOPIC FROM EXERCISE</span>':''}</div><h1>${h(d.name)}</h1><div class="tag">${h(d.area)}</div><div class="hero"><div><h2>In simple words</h2><p>${h(d.intro)}</p></div><div class="hero-art" aria-hidden="true">${d.icon}</div></div><div class="content-grid"><section class="info-card"><div class="kicker">01 · What happens here?</div><h2>What patients experience</h2><ul class="simple-list">${d.happens.map(x=>`<li>${h(x)}</li>`).join('')}</ul></section><section class="info-card services"><div class="kicker">02 · What services?</div><h2>Typical services</h2><ul class="simple-list">${d.services.map(x=>`<li>${h(x)}</li>`).join('')}</ul></section><section class="info-card team"><div class="kicker">03 · Who works here?</div><h2>Medical & nursing team</h2><div class="team-list">${d.team.map(x=>`<div class="team-member"><span class="role-icon">✚</span><div><strong>${h(x[0])}</strong><span>${h(x[1])}</span></div></div>`).join('')}</div></section></div><div class="vocab-heading"><div><div class="kicker eyebrow">04 · At the end of this department</div><h2>Key vocabulary · English → Ελληνικά</h2></div><p>Term → simple English synonym / meaning → Greek</p></div><div class="table-wrap"><table><thead><tr><th scope="col">Healthcare English</th><th scope="col">Simple English / synonym</th><th scope="col">Greek translation</th></tr></thead><tbody>${d.vocab.map(v=>`<tr><td>${h(v[0])}</td><td>${h(v[1])}</td><td lang="el">${h(v[2])}</td></tr>`).join('')}</tbody></table></div><div class="remember"><strong>★</strong><span><strong>Remember:</strong> ${h(d.remember)}</span></div></article>`}
function quizList(qs,answers,checked,type){return qs.map((q,i)=>{const chosen=answers[i],correct=checked&&chosen===(type==='reading'?q.a:q.a);let options=type==='reading'?[['T','True (T)'],['F','False (F)'],['NM','Not Mentioned (NM)']]:q.opts.map((x,j)=>[j,x]);return `<div class="question"><div class="question-number">Question ${String(i+1).padStart(2,'0')}</div><div class="question-title">${h(q.q)}</div><div class="answer-row">${options.map(([v,label])=>{const cls=checked?(v===q.a?'correct':v===chosen?'incorrect':''):(v===chosen?'selected':'');return `<button type="button" class="answer-btn ${cls}" ${checked?'disabled':''} data-answer="${type}" data-q="${i}" data-value="${v}" aria-pressed="${v===chosen}">${h(label)}</button>`}).join('')}</div>${checked?`<div class="feedback ${correct?'good':''}">${correct?'✓ Correct. ':'✗ '+(chosen===undefined?'Not answered. ':'Incorrect. ')}${h(q.why)}</div>`:''}</div>`}).join('')}
function scoreHtml(qs,answers){let n=qs.filter((q,i)=>answers[i]===q.a).length;return `<div class="score-banner" role="status">Score: ${n} / ${qs.length} correct. ${n===qs.length?'Excellent! Every answer is correct.':'Review the explanations, then try again to improve.'}</div>`}
function showComprehension(){const reading=compMode==='reading',qs=reading?originalQuestions:knowledgeQuestions,type=reading?'reading':'knowledge',checked=compChecked[type];return `<article class="slide slide-inner"><div class="eyebrow"><span class="dot"></span>ACTIVITY 01 OF 04 · READING</div><h1>Comprehension quiz</h1><p class="lead">Read carefully, choose your answers, then check your score and explanations.</p><div class="activity-toolbar"><button class="mode-btn ${reading?'active':''}" data-comp-mode="reading">Original text: T / F / NM (10)</button><button class="mode-btn ${!reading?'active':''}" data-comp-mode="knowledge">Departments: multiple choice (14)</button></div>${reading?'<div class="match-tip"><strong>Text detective rule:</strong> Judge statements using ONLY the reading excerpt provided by your teacher. “Not Mentioned” is possible even when you know something is true or false in real life. The six additional teaching slides do not change the original reading.</div>':'<div class="match-tip">These questions check all 14 department slides, including the six introductory topics added from the exercise.</div>'}${quizList(qs,compAnswers[type],checked,type)}${checked?scoreHtml(qs,compAnswers[type]):''}<div class="activity-actions"><button type="button" class="primary" data-check-comp>${checked?'Checked ✓':'Check my answers'}</button><button type="button" class="secondary" data-reset-comp>Try again ↻</button></div></article>`}
function showVocabulary(){return `<article class="slide slide-inner"><div class="eyebrow"><span class="dot"></span>ACTIVITY 02 OF 04 · MEANING & TRANSLATION</div><h1>Vocabulary quiz</h1><p class="lead">Choose the best English meaning or Greek translation for each healthcare word.</p><p class="mini-subtitle">18 questions · one answer for each</p>${quizList(vocabularyQuestions,vocabAnswers,vocabChecked,'vocabulary')}${vocabChecked?scoreHtml(vocabularyQuestions,vocabAnswers):''}<div class="activity-actions"><button type="button" class="primary" data-check-vocab>Check my answers</button><button type="button" class="secondary" data-reset-vocab>Try again ↻</button></div></article>`}
function showMatching(){let start=matchRound*7,items=matchingPairs.slice(start,start+7),order=[3,0,5,2,6,1,4],rights=order.map(j=>({i:start+j,val:items[j][1]}));return `<article class="slide slide-inner"><div class="eyebrow"><span class="dot"></span>ACTIVITY 03 OF 04 · FIND THE PAIRS</div><h1>Match the departments</h1><p class="lead">Select a hospital department on the left, then click the correct service on the right.</p><div class="activity-toolbar"><button class="mode-btn ${matchRound===0?'active':''}" data-round="0">Round 1 · 1–7</button><button class="mode-btn ${matchRound===1?'active':''}" data-round="1">Round 2 · 8–14</button></div><div class="match-tip" role="status">${matchFeedback||'Choose one department, then the description that matches it.'} &nbsp; · &nbsp; Matched: ${matched.size} / 7 · Mistakes: ${matchErrors}</div><div class="match-grid"><section class="match-col"><h3>HOSPITAL DEPARTMENT</h3>${items.map((p,j)=>`<button type="button" data-match-left="${start+j}" class="match-option ${matchLeft===start+j?'selected':''} ${matched.has(start+j)?'matched':''}" ${matched.has(start+j)?'disabled':''}>${matched.has(start+j)?'✓ ':'○ '}${h(p[0])}</button>`).join('')}</section><section class="match-col"><h3>WHAT HAPPENS THERE</h3>${rights.map(p=>`<button type="button" data-match-right="${p.i}" class="match-option ${matched.has(p.i)?'matched':''}" ${matched.has(p.i)?'disabled':''}>${matched.has(p.i)?'✓ ':'↔ '}${h(p.val)}</button>`).join('')}</section></div>${matched.size===7?`<div class="completion"><strong>🎉 Round complete!</strong><p>You've matched every department in this round.</p>${matchRound===0?'<button type="button" class="primary" data-round="1">Continue to Round 2 →</button>':'<button type="button" class="primary" data-next>Go to gap completion →</button>'}</div>`:''}<div class="activity-actions"><button type="button" class="secondary" data-reset-match>Reset this round ↻</button></div></article>`}
const normalize=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function showGaps(){let score=gaps.filter((g,i)=>g.a.some(a=>normalize(a)===normalize(gapAnswers[i]||''))).length;return `<article class="slide slide-inner"><div class="eyebrow"><span class="dot"></span>ACTIVITY 04 OF 04 · USE THE WORDS</div><h1>Complete the gaps</h1><p class="lead">Type one healthcare word or phrase into each sentence. Spelling matters; capital letters do not.</p><p class="mini-subtitle">14 sentences · one clue from each department</p>${gaps.map((g,i)=>{const correct=g.a.some(a=>normalize(a)===normalize(gapAnswers[i]||''));return `<div class="question"><div class="question-number">Sentence ${String(i+1).padStart(2,'0')}</div><label class="gap-sentence" for="gap-${i}"><span>${h(g.before)}</span><input id="gap-${i}" type="text" class="gap-field ${gapChecked?(correct?'correct':'incorrect'):''}" data-gap="${i}" value="${h(gapAnswers[i]||'')}" autocomplete="off" aria-label="Missing word for sentence ${i+1}"><span>${h(g.after)}</span></label>${gapHints&&!gapChecked?`<div class="hint">Hint: starts with “${h(g.hint)}”.</div>`:''}${gapChecked?`<div class="feedback ${correct?'good':''}">${correct?'✓ Correct!':'Answer: '+h(g.a[0])}</div>`:''}</div>`}).join('')}${gapChecked?`<div class="score-banner" role="status">Score: ${score} / ${gaps.length} correct. ${score===gaps.length?'Wonderful — you completed the lesson!':'Revise the highlighted answers and retry.'}</div>`:''}<div class="activity-actions"><button type="button" class="primary" data-check-gaps>Check my answers</button><button type="button" class="secondary" data-hints>Show first-letter hints</button><button type="button" class="secondary" data-reset-gaps>Try again ↻</button></div><div class="completion"><h3>Great work!</h3><p>You have explored the hospital departments, their services, the healthcare teams and specialist vocabulary. Return to any slide to revise.</p><button type="button" class="secondary" data-go="0">Back to the beginning ↩</button></div></article>`}
function render(){navRender();let s=slides[index],html=s.type==='cover'?showCover():s.type==='department'?showDepartment(departments[s.i],s.i):s.type==='comprehension'?showComprehension():s.type==='vocabulary'?showVocabulary():s.type==='matching'?showMatching():showGaps();$('screen').innerHTML=html;$('slideCount').textContent=`SLIDE ${index+1} OF ${slides.length}`;$('progressFill').style.width=`${(index+1)/slides.length*100}%`;$('prevBtn').disabled=index===0;$('nextBtn').disabled=index===slides.length-1;$('nextBtn').textContent=index===14?'Start activities →':index===slides.length-1?'Finished ✓':'Next →';wire()}
function go(n){index=Math.max(0,Math.min(slides.length-1,n));render();window.scrollTo({top:0,behavior:'instant'})}
function resetMatch(){matchLeft=null;matched=new Set();matchErrors=0;matchFeedback='Choose one department, then the description that matches it.';render()}
function wire(){document.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>go(index+1)));document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.go)));document.querySelectorAll('[data-comp-mode]').forEach(b=>b.addEventListener('click',()=>{compMode=b.dataset.compMode;render()}));document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{let type=b.dataset.answer,i=+b.dataset.q,val=type==='reading'?b.dataset.value:+b.dataset.value;if(type==='vocabulary'){vocabAnswers[i]=val}else{compAnswers[type][i]=val}renderQuestionSelection(type,i)}));let c=$('screen').querySelector('[data-check-comp]');if(c)c.addEventListener('click',()=>{compChecked[compMode]=true;render()});let rc=$('screen').querySelector('[data-reset-comp]');if(rc)rc.addEventListener('click',()=>{compAnswers[compMode]={};compChecked[compMode]=false;render()});let v=$('screen').querySelector('[data-check-vocab]');if(v)v.addEventListener('click',()=>{vocabChecked=true;render()});let rv=$('screen').querySelector('[data-reset-vocab]');if(rv)rv.addEventListener('click',()=>{vocabAnswers={};vocabChecked=false;render()});document.querySelectorAll('[data-round]').forEach(b=>b.addEventListener('click',()=>{matchRound=+b.dataset.round;resetMatch()}));document.querySelectorAll('[data-match-left]').forEach(b=>b.addEventListener('click',()=>{matchLeft=+b.dataset.matchLeft;matchFeedback='Now select the matching description on the right.';render()}));document.querySelectorAll('[data-match-right]').forEach(b=>b.addEventListener('click',()=>{let right=+b.dataset.matchRight;if(matchLeft===null){matchFeedback='First select a department on the left.'}else if(matchLeft===right){matched.add(right);matchLeft=null;matchFeedback='✓ Correct match! Keep going.'}else{matchErrors++;matchFeedback='Not quite. Try another description for the selected department.'}render()}));let rm=$('screen').querySelector('[data-reset-match]');if(rm)rm.addEventListener('click',resetMatch);document.querySelectorAll('[data-gap]').forEach(b=>b.addEventListener('input',()=>{gapAnswers[+b.dataset.gap]=b.value}));let cg=$('screen').querySelector('[data-check-gaps]');if(cg)cg.addEventListener('click',()=>{gapChecked=true;render()});let hi=$('screen').querySelector('[data-hints]');if(hi)hi.addEventListener('click',()=>{gapHints=!gapHints;render()});let rg=$('screen').querySelector('[data-reset-gaps]');if(rg)rg.addEventListener('click',()=>{gapAnswers={};gapChecked=false;gapHints=false;render()})}
function renderQuestionSelection(type,i){const question=$('screen').querySelectorAll('.question')[i];if(!question)return;const val=type==='vocabulary'?vocabAnswers[i]:compAnswers[type][i];question.querySelectorAll('.answer-btn').forEach(b=>{const selected=(type==='reading'?b.dataset.value:+b.dataset.value)===val;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))})}
$('prevBtn').addEventListener('click',()=>go(index-1));$('nextBtn').addEventListener('click',()=>go(index+1));$('homeBtn').addEventListener('click',()=>go(0));$('printBtn').addEventListener('click',()=>window.print());$('jumpBtn').addEventListener('click',()=>{const labels=slides.map((s,i)=>`${i+1}. ${s.name}`).join('\n');const response=window.prompt('Enter a slide number (1–'+slides.length+'):\n\n'+labels,'1');if(response!==null&&/^\d+$/.test(response.trim()))go(Number(response)-1)});document.addEventListener('keydown',e=>{if(e.target.closest('input,button'))return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});render();
</script>
</body>
</html>
