<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Healthcare Services English | Hospital Match-Up Challenge</title>
  <style>
    /* SELF-CONTAINED THEME — based on the dark, high-contrast source lesson. */
    :root { color-scheme:dark; --bg:#0b1926; --bg2:#122b3a; --panel:#172e3d; --panel2:#203b49; --line:#496775; --text:#f2f9fc; --muted:#c3d6de; --teal:#75e1d5; --teal2:#1c7980; --peach:#ffbf95; --green:#9bebc0; --red:#ffacb0; --shadow:0 20px 65px #020b1790; }
    * {box-sizing:border-box}
    html {scroll-behavior:smooth}
    body {margin:0;min-height:100vh;background:radial-gradient(circle at 95% 8%,#1d4a52 0,transparent 25%),linear-gradient(125deg,#091521 0%,#112a38 55%,#101f30 100%);color:var(--text);font:18px/1.55 Inter,'Segoe UI',Arial,sans-serif}
    button,input {font:inherit}
    button {cursor:pointer}
    button:focus-visible,input:focus-visible {outline:3px solid var(--peach);outline-offset:4px}
    button:disabled {cursor:default;opacity:.45}
    .app {min-height:100vh;display:flex;flex-direction:column}
    .topbar {position:sticky;top:0;z-index:10;background:#0d1e2bef;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px clamp(18px,3.5vw,56px);display:flex;justify-content:space-between;align-items:center;gap:18px}
    .brand {display:flex;align-items:center;gap:13px;min-width:0}
    .brand-mark {width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#177b83;font-size:29px;font-weight:800;box-shadow:0 7px 22px #0004;flex:none}
    .brand-kicker {font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--teal);font-weight:800}
    .brand-name {font-size:clamp(18px,2vw,25px);line-height:1.2;font-weight:850;letter-spacing:-.035em}
    .top-actions {display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .top-btn {background:#213d4b;border:1px solid #5a7c87;border-radius:100px;color:#f2fcff;padding:10px 16px;font-weight:750;font-size:15px;white-space:nowrap;transition:background .15s}
    .top-btn:hover:not(:disabled){background:#315766}
    .top-btn.accent {background:#1b6971;border-color:#79dcd0}
    .top-btn.accent:hover{background:#21828a}
    .top-btn svg {vertical-align:-3px;margin-right:5px}
    main {width:min(1150px,calc(100% - 36px));margin:32px auto 42px;flex:1}
    .frame {background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:26px;overflow:hidden;min-height:600px}
    .eyebrow {font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:900;color:var(--teal);display:flex;align-items:center;gap:10px}
    .eyebrow::before {content:'';width:9px;height:9px;border-radius:50%;background:var(--peach)}
    h1,h2,h3 {letter-spacing:-.04em;line-height:1.12}
    h1 {font-size:clamp(42px,5.6vw,76px);margin:20px 0}
    h2 {font-size:clamp(30px,3.3vw,43px);margin:13px 0}
    h3 {font-size:22px;margin:0 0 10px}
    p {margin:0 0 14px}
    .muted {color:var(--muted)}
    .hero {min-height:600px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);align-items:center;gap:30px;padding:clamp(30px,6vw,76px);background:radial-gradient(circle at 100% 5%,#275560 0 14%,transparent 14.2%),radial-gradient(circle at 70% 98%,#564236 0 12%,transparent 12.2%),linear-gradient(135deg,#203f4d,#172b3a 62%,#28323e)}
    .hero h1 em {font-style:normal;color:var(--teal)}
    .hero .lead {font-size:clamp(19px,2vw,24px);max-width:610px;color:#d4e5eb}
    .hero-side {border:1px solid #537581;border-radius:23px;background:#193443d9;padding:24px;box-shadow:0 10px 35px #07151d80}
    .hero-symbol {font-size:80px;text-align:center;line-height:1.3;margin:7px 0 12px}
    .hero-side h3 {text-align:center;color:var(--teal);margin-bottom:17px}
    .stats {display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .stat {border-radius:13px;background:#274754;text-align:center;padding:10px 5px}
    .stat strong {display:block;color:var(--teal);font-size:25px}
    .stat span {font-size:12px;color:#cfe0e8}
    .rules {display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:21px 0 23px}
    .rule {font-size:14px;background:#23424e;border:1px solid #486571;border-radius:11px;padding:10px 12px;color:#eaf8f9}
    .rule strong {display:block;font-size:17px;color:var(--peach)}
    .names {display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 14px}
    .field {flex:1;min-width:200px}
    .field label {display:block;font-size:13px;font-weight:800;color:#dceaf0;margin-bottom:6px}
    input[type=text],input[type=search] {width:100%;border:1px solid #70909a;background:#102a38;color:white;border-radius:12px;padding:12px 13px;min-height:47px}
    input::placeholder {color:#a9c0c9}
    .btn {border:1px solid transparent;border-radius:14px;padding:12px 21px;font-weight:850;color:#fff;min-height:49px;transition:transform .12s,background .12s}
    .btn:hover:not(:disabled){transform:translateY(-1px)}
    .btn.primary {background:#187b83;border-color:#8adbd2}
    .btn.primary:hover {background:#218d93}
    .btn.secondary {background:#294553;border-color:#6c8994}
    .btn.secondary:hover {background:#335b68}
    .btn.large {font-size:20px;padding:15px 25px}
    .tiny {font-size:13px;color:var(--muted)}
    .game {padding:clamp(22px,4vw,48px)}
    .scoreboard {display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:24px}
    .team {border:1.5px solid #496775;background:#203846;border-radius:17px;padding:15px 19px;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:background .2s}
    .team.active {border-color:#86e4d7;background:linear-gradient(115deg,#24585c,#213b49);box-shadow:0 0 0 2px #80ead01a}
    .team .who {font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:#c4d8e1;font-weight:750}
    .team .name {display:block;font-size:clamp(17px,2.1vw,24px);font-weight:900;overflow-wrap:anywhere}
    .team .score {font-size:clamp(30px,4vw,45px);line-height:1;font-weight:900;color:var(--teal);font-variant-numeric:tabular-nums}
    .turn {font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--peach);margin-bottom:10px}
    .track {height:9px;border-radius:40px;background:#2c4a59;overflow:hidden;margin-bottom:28px}
    .track span {display:block;height:100%;background:linear-gradient(90deg,#2d8c92,#8ee3cf);border-radius:40px;transition:width .2s}
    .question-panel {border:1px solid #496b75;border-radius:22px;background:linear-gradient(145deg,#213c49,#1a3342);padding:clamp(20px,4vw,40px)}
    .question-category {color:var(--teal);font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .question-text {font-size:clamp(25px,3.3vw,39px);line-height:1.25;font-weight:850;letter-spacing:-.035em;margin:12px 0 26px;max-width:880px}
    .answers {display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .answer {min-height:108px;display:flex;align-items:center;gap:18px;padding:20px;border:2px solid #6a8792;border-radius:16px;background:#2a4654;color:white;text-align:left;font-weight:800;font-size:clamp(17px,1.8vw,23px);line-height:1.3}
    .answer:not(:disabled):hover {background:#345966;border-color:#93e4d5}
    .answer .letter {display:grid;place-items:center;width:46px;height:46px;flex:none;border-radius:11px;background:#1a3845;color:var(--teal);font-size:21px}
    .answer:disabled{opacity:1;cursor:default}
    .answer.right {border-color:#9cf1c2;background:#205246;color:#eafff3}
    .answer.wrong {border-color:#ff9eaa;background:#633944;color:#fff0f1}
    .answer.dim {opacity:.65}
    .feedback,.clue {margin-top:19px;border-radius:14px;padding:17px 19px;font-size:17px}
    .feedback {border:1px solid #639788;background:#1e4a41}
    .feedback.bad {border-color:#be7780;background:#54343d}
    .feedback strong {display:block;font-size:22px;margin-bottom:6px}
    .clue {background:#503d31;border:1px solid #b88a62;color:#fff0e0}
    .question-bottom {display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:25px;flex-wrap:wrap}
    .question-bottom .status {color:#d3e4eb;font-size:15px}
    .finish {text-align:center;padding:clamp(28px,5vw,70px);background:radial-gradient(circle at 12% 12%,#285a5a,transparent 32%),linear-gradient(130deg,#203a48,#152c3a)}
    .trophy {font-size:68px;margin:9px 0}
    .finish h1 {font-size:clamp(38px,4.8vw,62px)}
    .finish .summary {font-size:22px;color:#d6e8ed;margin:0 auto 25px;max-width:760px}
    .finish .scoreboard {max-width:730px;margin:20px auto}
    .finish-actions {display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px 0 31px}
    .review {text-align:left;border-top:1px solid #4b6b76;padding-top:24px}
    .review h2 {font-size:28px}
    .review-grid {display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
    .review-card {background:#1d3846;border:1px solid #4b6c77;border-radius:12px;padding:13px 15px;font-size:15px}
    .review-card strong {color:var(--teal)}
    .review-card small {display:block;color:#cbdde4;margin-top:7px;font-size:13px}
    .glossary {padding:clamp(20px,4vw,45px)}
    .glossary-head {display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
    .glossary-head p {color:var(--muted);font-size:17px}
    .glossary-tools {display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .glossary-tools input {width:min(340px,100%)}
    .glossary-count {background:#224b52;color:#c5fff3;display:inline-block;font-size:13px;font-weight:850;padding:6px 12px;border-radius:100px;margin-bottom:15px}
    .glossary-section {border:1px solid #4c6975;border-radius:17px;overflow:hidden;margin:0 0 19px;background:#1c3543}
    .glossary-section h3 {background:#264957;padding:15px 17px;margin:0;color:#e0fff9;font-size:21px}
    .table-scroll {overflow-x:auto}
    table {width:100%;border-collapse:collapse;text-align:left}
    th {background:#20404d;color:#d6fdf5;font-size:14px;padding:13px 15px}
    td {border-top:1px solid #3e5b68;padding:11px 15px;font-size:15px;vertical-align:top}
    td:first-child {font-weight:850;color:#f5ffff;width:29%}
    td:nth-child(2) {width:42%}
    td:last-child {color:#abf1dd}
    tbody tr:nth-child(even){background:#203b49}
    .empty {padding:40px;text-align:center;color:var(--muted)}
    footer {padding:17px;text-align:center;background:#0c202d;color:#dbecef;border-top:1px solid #385361;font-size:15px}
    .print-sheet {display:none}
    .sr-only {position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    @media(max-width:850px){.topbar{align-items:flex-start}.hero{grid-template-columns:1fr}.hero-side{max-width:450px}.rules{grid-template-columns:1fr 1fr}.review-grid{grid-template-columns:1fr}}
    @media(max-width:600px){body{font-size:16px}.topbar{position:relative;display:block}.top-actions{margin-top:13px;justify-content:flex-start}.top-btn{font-size:13px;padding:9px 11px}.brand-name{font-size:20px}.brand-mark{width:40px;height:40px}main{width:calc(100% - 20px);margin:13px auto 25px}.frame{border-radius:18px;min-height:500px}.hero{padding:27px 21px}.hero h1{font-size:45px}.hero-side{padding:16px}.rules,.answers,.scoreboard{grid-template-columns:1fr}.answer{min-height:84px}.question-panel{padding:20px 15px}.game,.glossary{padding:17px}.question-text{font-size:27px}.glossary-tools{width:100%}.glossary-tools input{max-width:none;width:100%}td,th{padding:9px 10px;font-size:13px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
    @page {size:A4; margin:13mm 12mm}
    @media print { :root{color-scheme:light} body{background:white!important;color:#183641!important;font:10px/1.28 Arial,sans-serif} .app{display:none!important}.print-sheet{display:block!important} .print-heading{border-bottom:2px solid #187b83;margin-bottom:14px;padding-bottom:9px} .print-heading h1{font-size:21px;margin:3px 0;color:#183641}.print-heading p{font-size:11px;margin:0;color:#45606b}.print-section{break-before:auto;break-inside:auto;margin:13px 0 17px} .print-section h2{font-size:14px;background:#dcefeb;color:#125a62;padding:7px 8px;margin:0;break-after:avoid}.print-section table{table-layout:fixed;width:100%}.print-section th{background:#e7f4f0;color:#1c4f5b;font-size:10px;padding:5px 7px}.print-section td{border:1px solid #cedcda;color:#173844!important;font-size:9.2px;line-height:1.25;padding:5px 7px;overflow-wrap:break-word}.print-section td:nth-child(1){width:30%}.print-section td:nth-child(2){width:43%}.print-section td:nth-child(3){width:27%}.print-section tr{break-inside:avoid}.print-footer{margin-top:15px;border-top:1px solid #9eb4b9;padding-top:7px;font-size:10px;color:#42626a} }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">+</div><div><div class="brand-kicker">English for healthcare students</div><div class="brand-name">Healthcare Services English</div></div></div>
    <nav class="top-actions" aria-label="Challenge actions">
      <button class="top-btn" id="resetBtn" type="button">↻ Start Over</button>
      <button class="top-btn" id="clueBtn" type="button">✦ Hint / Clues</button>
      <button class="top-btn accent" id="glossaryBtn" type="button">▤ Glossary</button>
    </nav>
  </header>
  <main id="screen" aria-live="polite"></main>
  <footer>Evangelia Domvrou, teacher of English language and literature</footer>
</div>
<div class="print-sheet" id="printSheet" aria-hidden="true"></div>
<script>
'use strict';
/* EDITING TIP: Everything is inside this one HTML file, with no dependencies. */
/* SOURCE VOCABULARY: The 14 departmental lists below are taken from the supplied lesson. */
const departments=[
{name:"Obstetrics & Gynaecology",icon:"🤱",area:"Pregnancy, birth & women's health",intro:"This department helps people during pregnancy, childbirth and after birth. It also cares for the female reproductive system.",happens:["Pregnant patients have check-ups and prepare for birth.","Babies are delivered and mothers receive care after delivery.","Patients discuss reproductive health concerns."],services:["Antenatal (before-birth) care","Labour and delivery","Postnatal / postpartum care","Gynaecological examinations and treatment"],team:[["Obstetrician","Doctor specialising in pregnancy and childbirth"],["Gynaecologist","Doctor specialising in female reproductive health"],["Midwife","Professional supporting pregnancy and birth"],["Maternity nurse","Nurse caring for mothers around childbirth"]],vocab:[["obstetrics","pregnancy and childbirth medicine","μαιευτική"],["gynaecology","female reproductive health medicine","γυναικολογία"],["pregnancy","expecting a baby","εγκυμοσύνη"],["childbirth / delivery","the birth of a baby","τοκετός / γέννα"],["postpartum / postnatal","after childbirth","μετά τον τοκετό / λοχεία"],["reproductive system","organs involved in reproduction","αναπαραγωγικό σύστημα"],["antenatal","before birth","προγεννητικός"],["midwife","birth-care professional","μαία / μαιευτής"]],remember:"Obstetrics concerns pregnancy and birth; gynaecology concerns reproductive health."},
{name:"Haematology",icon:"🩸",area:"Blood and blood disorders",intro:"This department investigates and treats diseases of the blood. A laboratory also tests blood samples.",happens:["Patients with blood diseases are examined and treated.","Blood samples are studied in a haematology laboratory.","Doctors review test results and plan treatment."],services:["Blood tests and blood-cell counts","Investigation of anaemia and clotting problems","Monitoring blood diseases","Treatment and follow-up care"],team:[["Haematologist","Doctor specialising in blood disorders"],["Haematology nurse","Nurse supporting patients having blood treatment"],["Biomedical scientist","Laboratory professional examining blood samples"],["Phlebotomist","Professional trained to take blood samples"]],vocab:[["haematology","study and treatment of blood disorders","αιματολογία"],["haematological disease","blood disorder","αιματολογική πάθηση"],["blood sample","small amount of blood for testing","δείγμα αίματος"],["laboratory","place for scientific tests","εργαστήριο"],["blood count","measurement of blood cells","γενική εξέταση αίματος"],["anaemia","low haemoglobin or red blood cells","αναιμία"],["clotting","blood coagulation","πήξη του αίματος"],["treatment","medical care or therapy","θεραπεία"]],remember:"Haematology = blood medicine; the haematology laboratory performs blood tests."},
{name:"Orthopaedics",icon:"🦴",area:"Bones, joints, muscles & movement",intro:"Orthopaedics treats the musculoskeletal system: bones, joints, ligaments, tendons, muscles and related nerves.",happens:["Doctors diagnose injuries and disorders.","Patients receive surgical or non-surgical treatment.","Recovery programmes restore strength, movement and function.","Advice helps prevent injuries or slow disease progression."],services:["Diagnosis of fractures, spine problems and sports injuries","Medication, exercise, casts or surgery","Rehabilitation and physical therapy","Care for degenerative disease, infections, tumours and congenital disorders"],team:[["Orthopaedic surgeon","Doctor treating bones and joints, sometimes by surgery"],["Orthopaedic nurse","Nurse caring for patients with muscle or bone problems"],["Physiotherapist","Professional helping patients regain movement"],["Occupational therapist","Professional supporting daily activities during recovery"]],vocab:[["musculoskeletal","related to muscles and bones","μυοσκελετικός"],["ligament","tissue connecting bone to bone","σύνδεσμος"],["tendon","tissue connecting muscle to bone","τένοντας"],["trauma","physical injury","τραυματισμός"],["spine","backbone","σπονδυλική στήλη"],["degenerative disease","condition that worsens gradually","εκφυλιστική νόσος"],["congenital disorder","condition present at birth","συγγενής διαταραχή"],["casting / cast","support that keeps a bone still","γύψωση / γύψος"],["rehabilitation","recovery of abilities","αποκατάσταση"],["prevention","action to stop a problem","πρόληψη"],["tumour","abnormal growth of tissue","όγκος"],["surgical / non-surgical","with / without an operation","χειρουργικός / μη χειρουργικός"]],remember:"Orthopaedics uses BOTH surgical and non-surgical methods."},
{name:"Microbiology",icon:"🔬",area:"Microorganisms and diagnostic tests",intro:"The microbiology laboratory studies microorganisms and helps doctors identify infections. It receives samples from in-patients and out-patients.",happens:["Staff receive and examine specimens.","Laboratory tests look for microorganisms causing infection.","Results help clinicians choose appropriate care."],services:["Bacteriology: bacteria","Mycology: fungi","Parasitology: parasites","Virology: viruses","Mycobacteriology: mycobacteria"],team:[["Clinical microbiologist","Doctor or specialist interpreting microbiology tests"],["Biomedical laboratory scientist","Professional who processes and tests specimens"],["Specimen-collection nurse","Nurse who helps collect clinical samples"],["Infection prevention nurse","Nurse supporting safe infection-control practice"]],vocab:[["microbiology","study of microorganisms","μικροβιολογία"],["diagnostic","used to identify a disease","διαγνωστικός"],["bacteriology","study of bacteria","βακτηριολογία"],["mycology","study of fungi","μυκητολογία"],["parasitology","study of parasites","παρασιτολογία"],["virology","study of viruses","ιολογία"],["mycobacteriology","study of mycobacteria","μυκοβακτηριολογία"],["specimen","sample for testing","κλινικό δείγμα / δείγμα"],["in-patient","person staying in hospital","νοσηλευόμενος ασθενής"],["out-patient","person treated without admission","εξωτερικός ασθενής"]],remember:"Microbiology examines specimens, not only blood. Samples may come from in-patients or out-patients."},

const $ = id => document.getElementById(id);
const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const norm = value => String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase();
const totalWords = departments.reduce((sum,d)=>sum+d.vocab.length,0);
let view='welcome', returnView='welcome', round=0, selected=null, usedHint=false, glossaryQuery='';
let names=['Team A','Team B'], scores=[0,0], records=[];
let playQuestions=[];

function scoreMarkup(active=-1) {
  return `<div class="scoreboard" aria-label="Team scores">${names.map((name,i)=>`<div class="team ${active===i?'active':''}"><div><span class="who">${active===i?'● Playing now':`Team ${i+1}`}</span><span class="name">${esc(name)}</span></div><span class="score" aria-label="${scores[i]} points">${scores[i]}</span></div>`).join('')}</div>`;
}

function welcomeMarkup() {return `<section class="frame hero"><div><div class="eyebrow">The classroom team challenge</div><h1>Hospital Match-Up:<br><em>Who Does What?</em></h1><p class="lead">Distinguish hospital departments, healthcare specialists and the services they provide.</p><div class="rules"><div class="rule"><strong>20 rounds</strong>Two choices per question</div><div class="rule"><strong>2 teams</strong>10 turns each</div><div class="rule"><strong>2 or 1 points</strong>Correct without / with a clue</div></div><div class="names"><div class="field"><label for="team0">First team name</label><input id="team0" type="text" maxlength="24" value="${esc(names[0])}" autocomplete="off"></div><div class="field"><label for="team1">Second team name</label><input id="team1" type="text" maxlength="24" value="${esc(names[1])}" autocomplete="off"></div></div><button id="startBtn" class="btn primary large" type="button">Start the challenge →</button><p class="tiny" style="margin-top:15px">Teams take turns. Answers receive immediate feedback. Use “Hint / Clues” for help (a correct answer then earns 1 point instead of 2).</p></div><aside class="hero-side"><div class="hero-symbol" aria-hidden="true">🏥</div><h3>Departments • Specialties • Services</h3><div class="stats"><div class="stat"><strong>20</strong><span>questions</span></div><div class="stat"><strong>14</strong><span>departments</span></div><div class="stat"><strong>${totalWords}</strong><span>glossary entries</span></div></div><p class="tiny" style="text-align:center;margin-top:18px">Includes a printable English–Greek vocabulary glossary.</p></aside></section>`}

function gameMarkup(){ const q=playQuestions[round], team=round%2, answered=selected!==null, correct=answered&&selected===q.answer;
  return `<section class="frame game">${scoreMarkup(team)}<div class="turn">Question ${round+1} of ${QUESTIONS.length} · ${esc(names[team])}'s turn</div><div class="track" aria-label="${round+1} of ${QUESTIONS.length} rounds"><span style="width:${(round+1)/QUESTIONS.length*100}%"></span></div><div class="question-panel"><div class="question-category">${esc(q.category)}</div><div class="question-text">${esc(q.prompt)}</div><div class="answers">${q.choices.map((choice,i)=>{let state=answered?(i===q.answer?'right':i===selected?'wrong':'dim'):'';return `<button class="answer ${state}" type="button" data-choice="${i}" ${answered?'disabled':''} aria-label="Option ${i===0?'A':'B'}: ${esc(choice)}"><span class="letter">${i===0?'A':'B'}</span><span>${esc(choice)}</span></button>`}).join('')}</div>${usedHint?`<div class="clue" role="note"><strong>✦ Clue:</strong> ${esc(q.clue)} <span class="tiny" style="color:#ffddbf">· Correct answer now worth 1 point.</span></div>`:''}${answered?`<div class="feedback ${correct?'':'bad'}" role="status"><strong>${correct?'✓ Correct!':'✕ Not quite.'} ${correct?`+${usedHint?1:2} ${usedHint?'point':'points'}`:'+0 points'}</strong>${esc(q.explanation)}<br><span class="tiny" style="color:inherit">Correct answer: ${esc(q.choices[q.answer])}</span></div>`:''}</div><div class="question-bottom"><div class="status">${answered?'Answer locked in. Ready for the next team?':usedHint?'Clue revealed. Choose your answer.':'Choose A or B · Press 1 or 2 on your keyboard'}</div>${answered?`<button id="nextBtn" class="btn primary" type="button">${round===QUESTIONS.length-1?'See final results →':'Next question →'}</button>`:`<span class="tiny">${esc(names[team])} is playing</span>`}</div></section>`;
}

function finishMarkup(){let outcome=scores[0]===scores[1]?"It's a tie!":`${esc(names[scores[0]>scores[1]?0:1])} wins!`;
 return `<section class="frame finish"><div class="eyebrow" style="justify-content:center">Challenge completed</div><div class="trophy" aria-hidden="true">🏆</div><h1>${outcome}</h1><p class="summary">Great teamwork! You matched departments, specialists and hospital services across all 20 rounds.</p>${scoreMarkup()}<div class="finish-actions"><button id="againBtn" class="btn primary" type="button">Play again ↻</button><button id="finishGlossaryBtn" class="btn secondary" type="button">Open full glossary →</button></div><div class="review"><h2>Answer review</h2><p class="muted">Every question, the correct answer and the points earned.</p><div class="review-grid">${records.map((r,i)=>{const q=playQuestions[i];return `<div class="review-card"><strong>${i+1}. ${esc(q.choices[q.answer])}</strong><div>${esc(q.prompt)}</div><small>${esc(names[i%2])} · ${r.earned} ${r.earned===1?'point':'points'}${r.hint?' · clue used':''}</small></div>`}).join('')}</div></div></section>`;
}

function glossarySections(query=''){let shown=0;const sections=departments.map(d=>{const rows=d.vocab.filter(v=>!query||norm([d.name,...v].join(' ')).includes(norm(query)));if(!rows.length)return '';shown+=rows.length;return `<section class="glossary-section"><h3>${esc(d.icon)} ${esc(d.name)} <span class="tiny">(${rows.length})</span></h3><div class="table-scroll"><table><thead><tr><th>English term</th><th>Meaning / explanation</th><th>Greek translation</th></tr></thead><tbody>${rows.map(v=>`<tr><td>${esc(v[0])}</td><td>${esc(v[1])}</td><td>${esc(v[2])}</td></tr>`).join('')}</tbody></table></div></section>`}).join('');return {shown,html:sections||'<div class="empty">No matching vocabulary. Try another search.</div>'};}

function glossaryMarkup(){let data=glossarySections(glossaryQuery);return `<section class="frame glossary"><div class="glossary-head"><div><div class="eyebrow">Printable reference</div><h2>Full Vocabulary Glossary</h2><p>Every vocabulary entry from the uploaded lesson, with English meanings and Greek translations.</p></div><button id="backBtn" type="button" class="btn secondary">← Back to ${returnView==='game'?'challenge':returnView==='finish'?'results':'welcome'}</button></div><div class="glossary-tools"><input id="vocabSearch" type="search" placeholder="Search English or Greek words…" aria-label="Search vocabulary" value="${esc(glossaryQuery)}"><button class="btn primary" id="printBtn" type="button">⎙ Print full glossary</button></div><p class="tiny" style="margin:10px 0 16px">Printing always includes the complete glossary, even if a search is active.</p><div class="glossary-count" id="vocabCount">${data.shown} of ${totalWords} entries · ${departments.length} departments</div><div id="glossaryLists">${data.html}</div></section>`;}

function renderPrintSheet(){let content=`<div class="print-heading"><div style="font-weight:bold;color:#177b83;text-transform:uppercase;letter-spacing:1.3px">Healthcare Services English</div><h1>Hospital Departments & Specialties — Full Vocabulary Glossary</h1><p>${departments.length} departments · ${totalWords} entries · English meanings and Greek translations</p></div>`;
 for(const d of departments)content+=`<section class="print-section"><h2>${esc(d.name)}</h2><table><thead><tr><th>English term</th><th>Meaning / explanation</th><th>Greek translation</th></tr></thead><tbody>${d.vocab.map(v=>`<tr><td>${esc(v[0])}</td><td>${esc(v[1])}</td><td>${esc(v[2])}</td></tr>`).join('')}</tbody></table></section>`;
 $('printSheet').innerHTML=content+'<div class="print-footer">Evangelia Domvrou, teacher of English language and literature</div>';
}

function render(){ $('screen').innerHTML=view==='welcome'?welcomeMarkup():view==='game'?gameMarkup():view==='finish'?finishMarkup():glossaryMarkup();$('clueBtn').disabled=view!=='game'||selected!==null||usedHint;$('clueBtn').setAttribute('aria-disabled',String($('clueBtn').disabled));$('glossaryBtn').disabled=view==='glossary'; }
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
function start(){names=[($('team0')?.value||names[0]).trim()||'Team A',($('team1')?.value||names[1]).trim()||'Team B'];round=0;selected=null;usedHint=false;scores=[0,0];records=[];playQuestions=QUESTIONS.map(q=>{const flip=Math.random()<.5;return {...q,choices:flip?[...q.choices].reverse():[...q.choices],answer:flip?1-q.answer:q.answer}});view='game';render();scrollTop()}
function choose(index){if(view!=='game'||selected!==null||![0,1].includes(index))return;selected=index;const earned=index===playQuestions[round].answer?(usedHint?1:2):0;scores[round%2]+=earned;records[round]={chosen:index,earned,hint:usedHint};render();const feedback=document.querySelector('.feedback');feedback?.setAttribute('tabindex','-1');feedback?.focus({preventScroll:true})}
function next(){if(view!=='game'||selected===null)return;if(round===QUESTIONS.length-1){view='finish'}else{round++;selected=null;usedHint=false}render();scrollTop()}
function openGlossary(){if(view==='glossary')return;returnView=view;view='glossary';render();scrollTop()}
function back(){view=returnView;render();scrollTop()}
function reset(){if(view!=='welcome'&&!window.confirm('Start over? This will erase both teams’ scores and answers.'))return;view='welcome';round=0;selected=null;usedHint=false;scores=[0,0];records=[];glossaryQuery='';render();scrollTop()}

// Event delegation keeps every button responsive after each new question is rendered.
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.id==='startBtn')start();else if(target.hasAttribute('data-choice'))choose(Number(target.dataset.choice));else if(target.id==='nextBtn')next();else if(target.id==='againBtn'){view='welcome';render();scrollTop()}else if(target.id==='backBtn')back();else if(target.id==='finishGlossaryBtn')openGlossary();else if(target.id==='printBtn')window.print()});
$('resetBtn').addEventListener('click',reset);
$('clueBtn').addEventListener('click',()=>{if(view==='game'&&selected===null&&!usedHint){usedHint=true;render()}});
$('glossaryBtn').addEventListener('click',openGlossary);
document.addEventListener('input',e=>{if(e.target.id==='vocabSearch'){glossaryQuery=e.target.value;const data=glossarySections(glossaryQuery);$('vocabCount').textContent=`${data.shown} of ${totalWords} entries · ${departments.length} departments`;$('glossaryLists').innerHTML=data.html}});
document.addEventListener('keydown',e=>{if(view!=='game'||e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(selected===null&&(e.key==='1'||e.key==='2'))choose(Number(e.key)-1);else if(selected!==null&&e.key==='Enter'&&document.activeElement.tagName!=='BUTTON')next()});
renderPrintSheet();render();
</script>
</body>
</html>
